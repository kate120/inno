name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'module-07/**'
      - 'module-08/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: module-08
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install dependencies
        run: pip install -r requirements.txt
      - name: run tests
        run: pytest tests/ -v
